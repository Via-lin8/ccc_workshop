<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1141207 CCC 實務工作坊前測問卷</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 自定義進度條動畫 */
        .progress-bar {
            transition: width 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-[#F2F0EB]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Google Apps Script 網址
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTgA-AXWsunnz4jcgllK1zox1BsbcI1sZv_u6faZ4WNBqD_lfRlSAKyYg6RPE2e5Jp/exec";

        // 圖示組件 (直接內嵌 SVG 以避免依賴問題)
        const Icons = {
            Send: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            ),
            CheckCircle2: ({ size = 24, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            ),
            AlertCircle: ({ size = 14 }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            ),
            Loader2: ({ size = 18, className = "" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            )
        };

        function App() {
            const [formData, setFormData] = useState({
                phoneCode: '',
                birthCode: '',
                profession: [],
                isFormerMember: '',
                q1: '',
                q2: '',
                q3: '',
                q4: '',
                q5: ''
            });

            const [submitted, setSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [errors, setErrors] = useState({});
            const [progress, setProgress] = useState(0);

            const professionsList = [
                "西醫師", "中醫師", "牙醫師", "藥師", "醫事放射師", 
                "醫事檢驗師", "護理師", "營養師", "呼吸治療師", 
                "聽力師", "物理治療師", "職能治療師", "臨床心理師", "語言治療師"
            ];

            useEffect(() => {
                const totalFields = 9;
                let filledCount = 0;
                
                if (formData.phoneCode.length === 3) filledCount++;
                if (formData.birthCode.length === 2) filledCount++;
                if (formData.profession.length > 0) filledCount++;
                if (formData.isFormerMember) filledCount++;
                if (formData.q1) filledCount++;
                if (formData.q2) filledCount++;
                if (formData.q3) filledCount++;
                if (formData.q4) filledCount++;
                if (formData.q5) filledCount++;

                setProgress(Math.round((filledCount / totalFields) * 100));
            }, [formData]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                if (errors[name]) {
                    setErrors(prev => ({ ...prev, [name]: null }));
                }
            };

            const handleProfessionChange = (prof) => {
                setFormData(prev => {
                    const current = prev.profession;
                    let updated;
                    if (current.includes(prof)) {
                        updated = current.filter(p => p !== prof);
                    } else {
                        updated = [prof]; 
                    }
                    return { ...prev, profession: updated };
                });
                if (errors.profession) setErrors(prev => ({ ...prev, profession: null }));
            };

            const validate = () => {
                const newErrors = {};
                if (!formData.phoneCode || formData.phoneCode.length !== 3) newErrors.phoneCode = "請輸入手機後3碼";
                if (!formData.birthCode || formData.birthCode.length !== 2) newErrors.birthCode = "請輸入生日日期2碼";
                if (formData.profession.length === 0) newErrors.profession = "請選擇職類";
                if (!formData.isFormerMember) newErrors.isFormerMember = "請選擇是否擔任過 CCC 委員";
                
                ['q1', 'q2', 'q3', 'q4', 'q5'].forEach(q => {
                    if (!formData[q]) newErrors[q] = "此題為必填";
                });

                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!validate()) {
                    const firstError = document.querySelector('.error-message');
                    if (firstError) {
                        firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    return;
                }

                setIsSubmitting(true);

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(formData),
                    });

                    if (response.ok) {
                        setSubmitted(true);
                        window.scrollTo(0, 0);
                    } else {
                        alert("送出失敗，請稍後再試。");
                    }

                } catch (error) {
                    console.error("Error submitting form:", error);
                    alert("網路連線錯誤，請檢查您的網路狀態。");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleReset = () => {
                setFormData({
                    phoneCode: '',
                    birthCode: '',
                    profession: [],
                    isFormerMember: '',
                    q1: '',
                    q2: '',
                    q3: '',
                    q4: '',
                    q5: ''
                });
                setSubmitted(false);
                window.scrollTo(0, 0);
            };

            const colors = {
                bg: "bg-[#F2F0EB]",
                card: "bg-white",
                primary: "bg-[#7A8B8B]",
                primaryHover: "hover:bg-[#627272]",
                secondary: "bg-[#B5C9C3]",
                accent: "text-[#D8A48F]",
                textDark: "text-[#4A4A4A]",
                textLight: "text-[#8C8C8C]",
                border: "border-[#D1D5DB]",
                inputFocus: "focus:ring-[#B5C9C3]"
            };

            if (submitted) {
                return (
                    <div className={`min-h-screen ${colors.bg} flex items-center justify-center p-4 font-sans`}>
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center space-y-6">
                            <div className="w-20 h-20 bg-[#E8F0EE] rounded-full flex items-center justify-center mx-auto mb-4">
                                <Icons.CheckCircle2 size={40} className="text-[#7A8B8B]" />
                            </div>
                            <h2 className={`text-2xl font-bold ${colors.textDark}`}>提交成功！</h2>
                            <p className={`${colors.textDark}`}>
                                感謝您填寫「1141207 CCC 實務工作坊」前測問卷。<br/>
                                資料已成功儲存至系統。
                            </p>
                            <div className="p-4 bg-[#F9F9F9] rounded-lg text-left text-sm text-gray-600">
                                <p><strong>您的識別碼：</strong> {formData.phoneCode}{formData.birthCode}</p>
                                <p className="mt-1 text-xs text-gray-400">請記下此號碼以便進行後測配對。</p>
                            </div>
                            <button 
                                onClick={handleReset}
                                className={`w-full py-3 rounded-lg text-white font-medium transition-colors ${colors.primary} ${colors.primaryHover}`}
                            >
                                重新填寫
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen ${colors.bg} font-sans pb-12`}>
                    <div className="fixed top-0 left-0 w-full h-1.5 bg-gray-200 z-50">
                        <div 
                            className="h-full bg-[#D8A48F] transition-all duration-500 ease-out"
                            style={{ width: `${progress}%` }}
                        />
                    </div>

                    <div className="max-w-3xl mx-auto pt-10 px-4">
                        <header className="bg-white rounded-t-2xl p-8 shadow-sm border-b-4 border-[#7A8B8B] relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-[#F2F0EB] rounded-full -mr-16 -mt-16 opacity-50"></div>
                            <div className="relative z-10">
                                <h1 className={`text-2xl md:text-3xl font-bold ${colors.textDark} mb-4 leading-tight`}>
                                    1141207 CCC 實務工作坊<br/><span className="text-[#D8A48F]">前測問卷</span>
                                </h1>
                                <p className={`${colors.textDark} opacity-80 leading-relaxed text-sm md:text-base`}>
                                    為掌握與會者對 CCC 運作的熟悉度，請填寫您「目前」的狀態。
                                    本問卷結果僅供教學部調查工作坊教師參與成效參考。
                                </p>
                            </div>
                        </header>

                        <form onSubmit={handleSubmit} className="space-y-6 mt-6">
                            
                            <section className="bg-white rounded-2xl shadow-sm p-6 md:p-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-1 h-8 bg-[#D8A48F] rounded-full"></div>
                                    <h2 className={`text-xl font-bold ${colors.textDark}`}>基本資料</h2>
                                </div>

                                <div className="mb-8">
                                    <label className={`block font-bold ${colors.textDark} mb-3 flex items-start gap-2`}>
                                        <span className="text-[#D8A48F]">*</span>
                                        <div>
                                            1. 個人識別碼
                                            <p className="text-sm font-normal text-gray-400 mt-1">僅供前後測配對分析，不作身分識別</p>
                                        </div>
                                    </label>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-[#F9F9F9] p-6 rounded-xl border border-gray-100">
                                        <div>
                                            <label className="block text-sm text-gray-600 mb-2">手機號碼 <span className="text-[#D8A48F]">後 3 碼</span></label>
                                            <input
                                                type="text"
                                                name="phoneCode"
                                                maxLength="3"
                                                placeholder="例如: 678"
                                                value={formData.phoneCode}
                                                onChange={(e) => {
                                                    const val = e.target.value.replace(/\D/g, '');
                                                    handleInputChange({ target: { name: 'phoneCode', value: val }});
                                                }}
                                                className={`w-full p-3 rounded-lg border-2 bg-white outline-none transition-all ${errors.phoneCode ? 'border-red-300' : 'border-gray-200 focus:border-[#B5C9C3]'}`}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm text-gray-600 mb-2">生日日期 <span className="text-[#D8A48F]">2 碼</span></label>
                                            <input
                                                type="text"
                                                name="birthCode"
                                                maxLength="2"
                                                placeholder="例如: 09 (5月9日)"
                                                value={formData.birthCode}
                                                onChange={(e) => {
                                                    const val = e.target.value.replace(/\D/g, '');
                                                    handleInputChange({ target: { name: 'birthCode', value: val }});
                                                }}
                                                className={`w-full p-3 rounded-lg border-2 bg-white outline-none transition-all ${errors.birthCode ? 'border-red-300' : 'border-gray-200 focus:border-[#B5C9C3]'}`}
                                            />
                                        </div>
                                    </div>
                                    {(errors.phoneCode || errors.birthCode) && (
                                        <div className="text-red-400 text-sm mt-2 flex items-center gap-1 error-message">
                                            <Icons.AlertCircle size={14} /> 請完整填寫識別碼欄位
                                        </div>
                                    )}
                                </div>

                                <div className="mb-8">
                                    <label className={`block font-bold ${colors.textDark} mb-4`}>
                                        <span className="text-[#D8A48F] mr-1">*</span> 2. 您的職類
                                    </label>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                        {professionsList.map((prof) => (
                                            <label 
                                                key={prof} 
                                                className={`
                                                    cursor-pointer p-3 rounded-lg border-2 text-sm text-center transition-all duration-200 relative overflow-hidden
                                                    ${formData.profession.includes(prof) 
                                                        ? 'border-[#7A8B8B] bg-[#E8F0EE] text-[#5A6B6B] font-bold shadow-sm' 
                                                        : 'border-transparent bg-[#F5F5F0] text-gray-500 hover:bg-[#ECECE8]'}
                                                `}
                                            >
                                                <input
                                                    type="checkbox"
                                                    className="hidden"
                                                    checked={formData.profession.includes(prof)}
                                                    onChange={() => handleProfessionChange(prof)}
                                                />
                                                {prof}
                                                {formData.profession.includes(prof) && (
                                                    <div className="absolute top-0 right-0 w-3 h-3 bg-[#7A8B8B] rounded-bl-lg"></div>
                                                )}
                                            </label>
                                        ))}
                                    </div>
                                    {errors.profession && (
                                        <div className="text-red-400 text-sm mt-2 flex items-center gap-1 error-message">
                                            <Icons.AlertCircle size={14} /> {errors.profession}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className={`block font-bold ${colors.textDark} mb-4`}>
                                        <span className="text-[#D8A48F] mr-1">*</span> 3. 您過去是否擔任過 CCC 委員？
                                    </label>
                                    <div className="flex gap-4">
                                        {['是', '否'].map(opt => (
                                            <label key={opt} className="flex-1 cursor-pointer">
                                                <input
                                                    type="radio"
                                                    name="isFormerMember"
                                                    value={opt}
                                                    checked={formData.isFormerMember === opt}
                                                    onChange={handleInputChange}
                                                    className="hidden"
                                                />
                                                <div className={`
                                                    py-3 text-center rounded-lg border-2 transition-all
                                                    ${formData.isFormerMember === opt 
                                                        ? 'border-[#D8A48F] bg-[#FFF8F6] text-[#C08A78] font-bold' 
                                                        : 'border-gray-200 text-gray-500 hover:border-gray-300'}
                                                `}>
                                                    {opt}
                                                </div>
                                            </label>
                                        ))}
                                    </div>
                                    {errors.isFormerMember && (
                                        <div className="text-red-400 text-sm mt-2 flex items-center gap-1 error-message">
                                            <Icons.AlertCircle size={14} /> {errors.isFormerMember}
                                        </div>
                                    )}
                                </div>
                            </section>

                            <section className="bg-white rounded-2xl shadow-sm p-6 md:p-8">
                                <div className="flex items-center gap-3 mb-2">
                                    <div className="w-1 h-8 bg-[#7A8B8B] rounded-full"></div>
                                    <h2 className={`text-xl font-bold ${colors.textDark}`}>自我評估</h2>
                                </div>
                                <p className="text-sm text-gray-500 mb-8 ml-4">
                                    請依據您「當下」的狀態，評估是否符合下列描述 (1=非常不符合 ~ 5=非常符合)
                                </p>

                                {[
                                    { id: 'q1', text: '我目前清楚了解「信賴評定 (Entrustment Decision)」與傳統「分數評量」在評估邏輯上的具體差異。' },
                                    { id: 'q2', text: '我熟悉 CCC 會議的運作流程（包含Portfolio解讀、共識形成、召開頻率等）。' },
                                    { id: 'q3', text: '我有能力辨識學員何時需啟動補強計畫。' },
                                    { id: 'q4', text: '我有信心能針對學員的臨床缺失，制定出具體的補強計畫 (Remediation Plan)。' },
                                    { id: 'q5', text: '我目前能熟練運用回饋模組(ADAPT、….)來引導學員進行自我反思。' }
                                ].map((q, idx) => (
                                    <div key={q.id} className="mb-10 last:mb-0 border-b border-dashed border-gray-100 pb-8 last:border-0">
                                        <label className={`block font-medium ${colors.textDark} mb-4 leading-relaxed`}>
                                            <span className="text-[#7A8B8B] font-bold mr-2">{idx + 1}.</span>
                                            {q.text} <span className="text-[#D8A48F]">*</span>
                                        </label>
                                        
                                        <div className="flex justify-between items-center gap-2 max-w-xl mx-auto md:mx-0">
                                            <span className="text-xs text-gray-400 hidden md:block">非常不符合</span>
                                            {[1, 2, 3, 4, 5].map((val) => (
                                                <label key={val} className="cursor-pointer group relative flex flex-col items-center gap-2">
                                                    <input
                                                        type="radio"
                                                        name={q.id}
                                                        value={val}
                                                        checked={formData[q.id] === String(val)}
                                                        onChange={handleInputChange}
                                                        className="hidden"
                                                    />
                                                    <div className={`
                                                        w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-lg font-medium transition-all duration-300 shadow-sm
                                                        ${formData[q.id] === String(val) 
                                                            ? 'bg-[#7A8B8B] text-white scale-110 shadow-md ring-4 ring-[#E8F0EE]' 
                                                            : 'bg-[#F5F5F0] text-gray-400 group-hover:bg-[#EAEAE5]'}
                                                    `}>
                                                        {val}
                                                    </div>
                                                    <span className={`text-xs ${formData[q.id] === String(val) ? 'text-[#7A8B8B] font-bold' : 'text-gray-300'} md:hidden`}>
                                                        {val === 1 ? '不符合' : val === 5 ? '符合' : ''}
                                                    </span>
                                                </label>
                                            ))}
                                            <span className="text-xs text-gray-400 hidden md:block">非常符合</span>
                                        </div>
                                        {errors[q.id] && (
                                            <div className="text-red-400 text-sm mt-3 flex items-center gap-1 error-message justify-center md:justify-start">
                                                <Icons.AlertCircle size={14} /> 請完成此題評分
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </section>

                            <div className="bg-[#E8F0EE] rounded-xl p-6 text-center md:text-left md:flex justify-between items-center border border-[#7A8B8B] border-opacity-20">
                                <div className="mb-4 md:mb-0">
                                    <h3 className="text-sm font-bold text-[#5A6B6B] mb-1">聯絡資訊</h3>
                                    <p className="text-xs text-[#7A8B8B]">主辦單位：教學部 核心能力組</p>
                                    <p className="text-xs text-[#7A8B8B]">聯絡人：林淑雅 (57438)、楊宜婷 (57429)</p>
                                </div>
                                
                                <button
                                    type="submit"
                                    disabled={isSubmitting}
                                    className={`
                                        group flex items-center justify-center gap-2 px-8 py-3 rounded-full text-white font-bold transition-all shadow-lg
                                        ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : `${colors.primary} hover:bg-[#627272] active:scale-95`} 
                                        w-full md:w-auto
                                    `}
                                >
                                    {isSubmitting ? (
                                        <span className="flex items-center gap-2">
                                            <Icons.Loader2 size={18} className="animate-spin" />
                                            處理中...
                                        </span>
                                    ) : (
                                        <span className="flex items-center gap-2">
                                            提交問卷
                                            <Icons.Send size={18} className="group-hover:translate-x-1 transition-transform" />
                                        </span>
                                    )}
                                </button>
                            </div>

                        </form>
                    </div>
                    
                    <div className="text-center text-gray-300 text-xs mt-8 pb-4">
                        &copy; 1141207 CCC Workshop Pre-test
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
