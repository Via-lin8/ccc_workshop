<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1141207 CCC實務工作坊-前測問卷</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Custom Config for Morandi Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        morandi: {
                            bg: '#F5F5F3',       // 淺米灰背景
                            card: '#FFFFFF',     // 卡片白
                            primary: '#8FA39A',  // 莫蘭迪綠 (主要按鈕/標題)
                            secondary: '#9CAFB7',// 莫蘭迪藍 (次要元素)
                            accent: '#C2B0A3',   // 莫蘭迪褐 (強調)
                            text: '#595959',     // 深灰字體
                            lightText: '#8C8C8C',// 淺灰字體
                            border: '#E0E0E0',   // 邊框
                            hover: '#7A8F86',    // 懸停綠
                            selected: '#E3E9E6'  // 選中背景
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F5F5F3;
            color: #595959;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F5F5F3; 
        }
        ::-webkit-scrollbar-thumb {
            background: #C2B0A3; 
            border-radius: 4px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ★★★ 已設定您的 Apps Script 部署網址 ★★★
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTgA-AXWsunnz4jcgllK1zox1BsbcI1sZv_u6faZ4WNBqD_lfRlSAKyYg6RPE2e5Jp/exec"; 

        // --- Inline Icons ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const CheckCircle = (props) => (
            <IconBase {...props}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </IconBase>
        );

        const ClipboardList = (props) => (
            <IconBase {...props}>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <path d="M12 11h4"/>
                <path d="M12 16h4"/>
                <path d="M8 11h.01"/>
                <path d="M8 16h.01"/>
            </IconBase>
        );

        const Send = (props) => (
            <IconBase {...props}>
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </IconBase>
        );

        const User = (props) => (
            <IconBase {...props}>
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </IconBase>
        );

        const Award = (props) => (
            <IconBase {...props}>
                <circle cx="12" cy="8" r="7"></circle>
                <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
            </IconBase>
        );

        const BookOpen = (props) => (
            <IconBase {...props}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </IconBase>
        );

        const UserCheck = (props) => (
            <IconBase {...props}>
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <polyline points="17 11 19 13 23 9"></polyline>
            </IconBase>
        );
        // --------------------------------------------------------

        // 職類選項
        const jobOptions = [
            "西醫師", "中醫師", "牙醫師", "藥師", "醫事放射師", 
            "醫事檢驗師", "護理師", "營養師", "呼吸治療師", 
            "聽力師", "物理治療師", "職能治療師", "臨床心理師", "語言治療師"
        ];

        // 自我評估題目
        const assessmentQuestions = [
            {
                id: "q_assess_1",
                text: "我目前清楚了解「信賴評定 (Entrustment Decision)」與傳統「分數評量」在評估邏輯上的具體差異。"
            },
            {
                id: "q_assess_2",
                text: "我熟悉 CCC 會議的運作流程（包含Portfolio解讀、共識形成、召開頻率等）。"
            },
            {
                id: "q_assess_3",
                text: "我有能力辨識學員何時需啟動補強計畫。"
            },
            {
                id: "q_assess_4",
                text: "我有信心能針對學員的臨床缺失，制定出具體的補強計畫 (Remediation Plan)。"
            },
            {
                id: "q_assess_5",
                text: "我目前能熟練運用結構化回饋模組 (STDS、PREPS、GAS、ERCP、ADAPT等) 來引導學員進行自我反思。"
            }
        ];

        const App = () => {
            const [formData, setFormData] = useState({
                role: "",
                isPastMember: "",
                scores: {}
            });
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            // 處理職類選擇
            const handleRoleChange = (role) => {
                setFormData(prev => ({ ...prev, role }));
            };

            // 處理 CCC 委員經驗
            const handleMemberChange = (val) => {
                setFormData(prev => ({ ...prev, isPastMember: val }));
            };

            // 處理評分題
            const handleScoreChange = (qId, val) => {
                setFormData(prev => ({
                    ...prev,
                    scores: {
                        ...prev.scores,
                        [qId]: val
                    }
                }));
            };

            const isFormComplete = () => {
                const isRoleSet = formData.role !== "";
                const isMemberSet = formData.isPastMember !== "";
                const isScoresSet = assessmentQuestions.every(q => formData.scores[q.id]);
                return isRoleSet && isMemberSet && isScoresSet;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!isFormComplete()) {
                    return;
                }
                
                setLoading(true);

                // 再次檢查 URL 是否正確
                if (!GOOGLE_SCRIPT_URL) {
                    alert("請檢查 Google Apps Script URL 設定！");
                    setLoading(false);
                    return;
                }

                try {
                    // 使用 fetch 發送請求到 Google Apps Script
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors", // 重要：解決跨域問題
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8",
                        },
                        body: JSON.stringify(formData),
                    });

                    // 成功後執行 (因為 no-cors 模式無法讀取回傳值，我們假設不報錯即成功)
                    setLoading(false);
                    setSubmitted(true);
                    window.scrollTo(0, 0);

                } catch (error) {
                    console.error("Error:", error);
                    alert("資料傳送失敗，請檢查網路連線或稍後再試。");
                    setLoading(false);
                }
            };

            if (submitted) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full text-center border-t-8 border-morandi-primary">
                            <div className="mb-6 flex justify-center">
                                <div className="bg-green-100 p-4 rounded-full">
                                    <CheckCircle size={64} className="text-morandi-primary" />
                                </div>
                            </div>
                            <h2 className="text-3xl font-bold text-morandi-primary mb-4">提交成功</h2>
                            <p className="text-morandi-text text-lg mb-8">感謝您填寫 1141207 CCC實務工作坊前測問卷。<br/>您的回饋對我們非常重要。</p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="bg-morandi-secondary hover:bg-morandi-hover text-white px-8 py-3 rounded-full transition-all duration-300 shadow-md"
                            >
                                返回問卷
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-12 animate-fade-in">
                    {/* Header Banner */}
                    <header className="bg-morandi-primary text-white py-12 px-4 shadow-lg relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                            <svg width="100%" height="100%">
                                <pattern id="pattern-circles" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <circle cx="20" cy="20" r="2" fill="currentColor"/>
                                </pattern>
                                <rect x="0" y="0" width="100%" height="100%" fill="url(#pattern-circles)"/>
                            </svg>
                        </div>
                        <div className="max-w-3xl mx-auto relative z-10">
                            <div className="flex items-center gap-3 mb-4 opacity-90">
                                <ClipboardList size={24} />
                                <span className="uppercase tracking-widest text-sm font-medium">Pre-Workshop Survey</span>
                            </div>
                            <h1 className="text-3xl md:text-4xl font-bold mb-4 leading-tight">1141207 CCC實務工作坊<br/>前測問卷</h1>
                            <p className="text-white/90 text-lg leading-relaxed max-w-2xl">
                                為掌握與會者對 CCC 運作的熟悉度，請填寫您「目前」的狀態。本問卷結果僅供教學部調查工作坊教師參與成效參考。
                            </p>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto px-4 -mt-8 relative z-20">
                        <form onSubmit={handleSubmit} className="space-y-8">
                            
                            {/* Section 1: Basic Info */}
                            <section className="bg-white rounded-2xl shadow-sm border border-morandi-border overflow-hidden">
                                <div className="bg-morandi-secondary/10 px-6 py-4 border-b border-morandi-border flex items-center gap-3">
                                    <User className="text-morandi-secondary" />
                                    <h2 className="text-xl font-bold text-morandi-text">一、基本資料</h2>
                                </div>
                                <div className="p-6 md:p-8 space-y-8">
                                    
                                    {/* Q1 Job Role */}
                                    <div className="space-y-4">
                                        <label className="block text-lg font-medium text-morandi-text flex items-center gap-2">
                                            <span className="text-red-400">*</span>
                                            1. 您的職類：
                                        </label>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                            {jobOptions.map((role) => (
                                                <label 
                                                    key={role}
                                                    className={`
                                                        relative cursor-pointer rounded-lg p-3 text-center transition-all duration-200 border
                                                        ${formData.role === role 
                                                            ? 'bg-morandi-primary text-white border-morandi-primary shadow-md transform scale-[1.02]' 
                                                            : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-morandi-selected hover:border-morandi-secondary'}
                                                    `}
                                                >
                                                    <input 
                                                        type="radio" 
                                                        name="jobRole" 
                                                        value={role}
                                                        checked={formData.role === role}
                                                        onChange={() => handleRoleChange(role)}
                                                        className="absolute opacity-0 w-full h-full cursor-pointer top-0 left-0"
                                                    />
                                                    <span className="text-sm md:text-base">{role}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Q2 CCC Member */}
                                    <div className="space-y-4">
                                        <label className="block text-lg font-medium text-morandi-text flex items-center gap-2">
                                            <span className="text-red-400">*</span>
                                            2. 您過去是否擔任過 CCC 委員？
                                        </label>
                                        <div className="flex gap-6">
                                            {["是", "否"].map((option) => (
                                                <label key={option} className="flex items-center gap-3 cursor-pointer group">
                                                    <div className={`
                                                        w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors
                                                        ${formData.isPastMember === option ? 'border-morandi-primary' : 'border-gray-300 group-hover:border-morandi-secondary'}
                                                    `}>
                                                        {formData.isPastMember === option && (
                                                            <div className="w-3 h-3 rounded-full bg-morandi-primary" />
                                                        )}
                                                    </div>
                                                    <input 
                                                        type="radio" 
                                                        name="isMember" 
                                                        value={option}
                                                        checked={formData.isPastMember === option}
                                                        onChange={() => handleMemberChange(option)}
                                                        className="hidden"
                                                    />
                                                    <span className={`text-lg transition-colors ${formData.isPastMember === option ? 'text-morandi-primary font-medium' : 'text-gray-600'}`}>
                                                        {option}
                                                    </span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                </div>
                            </section>

                            {/* Section 2: Self Assessment */}
                            <section className="bg-white rounded-2xl shadow-sm border border-morandi-border overflow-hidden">
                                <div className="bg-morandi-secondary/10 px-6 py-4 border-b border-morandi-border flex items-center gap-3">
                                    <Award className="text-morandi-secondary" />
                                    <div>
                                        <h2 className="text-xl font-bold text-morandi-text">二、自我評估</h2>
                                        <p className="text-sm text-morandi-lightText mt-1">
                                            請依據您「當下」的狀態，評估您是否「符合」下列描述 (1=非常不符合 ~ 5=非常符合)
                                        </p>
                                    </div>
                                </div>
                                <div className="p-6 md:p-8 space-y-10">
                                    {assessmentQuestions.map((q, index) => (
                                        <div key={q.id} className="space-y-4 pb-6 border-b border-gray-100 last:border-0 last:pb-0">
                                            <div className="flex items-start gap-2">
                                                <span className="text-morandi-primary font-bold text-lg">{index + 1}.</span>
                                                <p className="text-lg text-morandi-text font-medium leading-relaxed">
                                                    <span className="text-red-400 mr-1">*</span>
                                                    {q.text}
                                                </p>
                                            </div>
                                            
                                            {/* Likert Scale */}
                                            <div className="pt-2">
                                                <div className="flex justify-between text-xs text-morandi-lightText mb-2 px-2">
                                                    <span>非常不符合</span>
                                                    <span>非常符合</span>
                                                </div>
                                                <div className="flex justify-between items-center gap-2 bg-gray-50 p-4 rounded-xl">
                                                    {[1, 2, 3, 4, 5].map((score) => (
                                                        <label key={score} className="flex flex-col items-center gap-2 cursor-pointer group flex-1">
                                                            <div className={`
                                                                w-10 h-10 md:w-12 md:h-12 rounded-full border-2 flex items-center justify-center text-lg font-medium transition-all duration-300
                                                                ${formData.scores[q.id] === score 
                                                                    ? 'bg-morandi-primary text-white border-morandi-primary shadow-lg transform scale-110' 
                                                                    : 'bg-white text-gray-400 border-gray-200 group-hover:border-morandi-secondary group-hover:text-morandi-secondary'}
                                                            `}>
                                                                {score}
                                                            </div>
                                                            <input 
                                                                type="radio" 
                                                                name={q.id}
                                                                value={score}
                                                                checked={formData.scores[q.id] === score}
                                                                onChange={() => handleScoreChange(q.id, score)}
                                                                className="hidden"
                                                            />
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* Submit Button */}
                            <div className="flex flex-col items-center gap-4 pt-4">
                                <button 
                                    type="submit" 
                                    disabled={loading || !isFormComplete()}
                                    className={`
                                        w-full md:w-auto px-12 py-4 rounded-full text-lg font-bold flex items-center justify-center gap-2 transition-all duration-300 shadow-lg
                                        ${isFormComplete() 
                                            ? 'bg-morandi-primary text-white hover:bg-morandi-hover hover:shadow-xl hover:-translate-y-1' 
                                            : 'bg-gray-300 text-gray-500 cursor-not-allowed'}
                                    `}
                                >
                                    {loading ? (
                                        <span className="animate-pulse">提交中...</span>
                                    ) : (
                                        <>
                                            提交問卷 <Send size={20} />
                                        </>
                                    )}
                                </button>
                                {!isFormComplete() && (
                                    <p className="text-sm text-red-400 bg-red-50 px-4 py-1 rounded-full">
                                        還有問題尚未填寫完成
                                    </p>
                                )}
                            </div>

                        </form>

                        {/* Footer */}
                        <footer className="mt-16 text-center text-morandi-lightText border-t border-morandi-border pt-8">
                            <div className="flex flex-col md:flex-row justify-center items-center gap-2 md:gap-8 mb-4">
                                <div className="flex items-center gap-2">
                                    <BookOpen size={16} />
                                    <span className="font-medium">主辦單位：教學部 核心能力組</span>
                                </div>
                                <div className="hidden md:block w-px h-4 bg-gray-300"></div>
                                <div className="flex items-center gap-2">
                                    <UserCheck size={16} />
                                    <span>聯絡人：林淑雅 (#57438) / 楊宜婷 (#57429)</span>
                                </div>
                            </div>
                            <p className="text-xs opacity-60">© 2024 Clinical Competence Committee Workshop</p>
                        </footer>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
