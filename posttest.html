<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1141207 CCC 實務工作坊 - 後測問卷</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Configure Tailwind with Professional Palette -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#F8FAFC',
                            100: '#F1F5F9',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                            600: '#475569',
                            700: '#334155',
                            800: '#1E293B',
                            900: '#0F172A',
                        },
                        brand: {
                            light: '#E6E8E6',     // 淺灰基底
                            DEFAULT: '#7A918D',   // 莫蘭迪綠 (主色) - 對應 bg-brand
                            dark: '#5C6F6C',      // 深莫蘭迪綠 (強調)
                            accent: '#C58970',    // 暖橘 (重點/警告)
                            surface: '#FFFFFF',   // 表面色
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        serif: ['Noto Serif TC', 'Georgia', 'serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 40px -10px rgba(0, 0, 0, 0.1)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F1F5F9;
            color: #334155;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .serif-title {
            font-family: 'Noto Serif TC', serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // CONFIGURATION
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4CMmBNeIPRdyWP51KfNpqFkjgRPM9pZdfvnjqijL5HadQD8L-6H5uzoRtYZ3fwpWNzA/exec"; 

        // Data Models
        const roles = [
            "西醫師", "中醫師", "牙醫師", "藥師", "醫事放射師", 
            "醫事檢驗師", "護理師", "營養師", "呼吸治療師", 
            "聽力師", "物理治療師", "職能治療師", "臨床心理師", "語言治療師"
        ];

        const questionsPart2 = [
            "我目前清楚了解「信賴評定 (Entrustment Decision)」與傳統「分數評量」在評估邏輯上的具體差異。",
            "我熟悉 CCC 會議的運作流程（包含 Portfolio 解讀、共識形成、召開頻率等）。",
            "我有能力辨識學員何時需啟動補強計畫。",
            "我有信心能針對學員的臨床缺失，制定出具體的補強計畫 (Remediation Plan)。",
            "我目前能熟練運用結構化回饋模組 (STDS、PREPS、GAS、ERCP、ADAPT等) 來引導學員進行自我反思。"
        ];

        const questionsPart3 = [
            "課程內容符合我個人的學習需求。",
            "我認為我已達成本課程設定的學習目標。",
            "本課程的內容與我的工作實務相關。",
            "我計劃將本次課程所學，應用於我的日常教學中。"
        ];

        const difficulties = [
            "人力/時間不足",
            "缺乏具體表單工具",
            "同儕共識不足",
            "給予負面回饋的心理壓力",
            "其他"
        ];

        const questionsPart4 = [
            "講師具備豐富的專業知識與教學熱忱。",
            "課程教材內容與活動安排準備充分。",
            "課程教學清晰有條理，能掌握重點。",
            "課程時間與環境 (含硬體設備) 安排適當。",
            "整體而言，我對本次課程感到滿意。"
        ];

        // Component: Scale (1-5) - Rectangular & Flex-1
        const LikertScale = ({ id, value, onChange, lowLabel = "非常不符合", highLabel = "非常符合" }) => {
            return (
                <div className="pt-2 pb-1">
                    <div className="flex justify-between text-xs text-slate-400 mb-2 px-1 font-medium">
                        <span>{lowLabel}</span>
                        <span>{highLabel}</span>
                    </div>
                    <div className="flex w-full gap-2 md:gap-3">
                        {[1, 2, 3, 4, 5].map((num) => (
                            <button
                                key={num}
                                type="button"
                                onClick={() => onChange(num)}
                                className={`
                                    flex-1 py-3 rounded-lg flex items-center justify-center text-sm md:text-base font-bold transition-all duration-200 focus:outline-none
                                    ${value === num 
                                        ? 'bg-brand text-white shadow-md transform -translate-y-1' 
                                        : 'bg-white text-slate-400 border border-slate-200 hover:border-brand hover:text-brand hover:bg-slate-50'}
                                `}
                            >
                                {num}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        // Component: Section Card - Professional Style
        const SectionCard = ({ title, subtitle, children, icon }) => (
            <div className="bg-white rounded-2xl p-6 md:p-8 mb-6 shadow-sm border border-slate-100 fade-in relative overflow-hidden group">
                <div className="absolute top-0 left-0 w-1 h-full bg-brand opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                    <div className="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-brand-dark text-xl flex-shrink-0">
                        {icon}
                    </div>
                    <div>
                        <h2 className="text-lg md:text-xl font-bold text-slate-800 tracking-tight">{title}</h2>
                        {subtitle && <p className="text-xs md:text-sm text-slate-500 mt-1 leading-tight">{subtitle}</p>}
                    </div>
                </div>
                {children}
            </div>
        );

        // Main App Component
        const App = () => {
            const [formData, setFormData] = useState({
                role: "",
                part2: {},
                part3: {},
                part3_diff: [],
                part3_diff_other: "",
                part4: {},
                part4_feedback: ""
            });

            const [status, setStatus] = useState("idle"); // idle, submitting, success, error
            const [errorMsg, setErrorMsg] = useState("");

            const handleScaleChange = (section, index, value) => {
                setFormData(prev => ({
                    ...prev,
                    [section]: {
                        ...prev[section],
                        [index]: value
                    }
                }));
                if(errorMsg) setErrorMsg("");
            };

            const handleDiffChange = (item) => {
                setFormData(prev => {
                    const current = prev.part3_diff;
                    if (current.includes(item)) {
                        return { ...prev, part3_diff: current.filter(i => i !== item) };
                    } else {
                        return { ...prev, part3_diff: [...current, item] };
                    }
                });
                if(errorMsg) setErrorMsg("");
            };

            const validateForm = () => {
                if (!formData.role) return "請選擇您的職類";
                if (Object.keys(formData.part2).length !== questionsPart2.length) return "請完成「學習成效評估」的所有題目";
                if (Object.keys(formData.part3).length !== questionsPart3.length) return "請完成「學習與應用」的所有題目";
                if (formData.part3_diff.length === 0) return "請至少選擇一項「執行困難點」";
                if (formData.part3_diff.includes("其他") && !formData.part3_diff_other.trim()) return "您勾選了「其他」，請填寫具體困難點";
                if (Object.keys(formData.part4).length !== questionsPart4.length) return "請完成「課程滿意度評估」的所有題目";
                return null;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const error = validateForm();
                if (error) {
                    setErrorMsg(error);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                
                setStatus("submitting");

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(formData),
                        headers: {
                            "Content-Type": "text/plain;charset=utf-8",
                        },
                    });

                    if (response.ok || response.type === 'opaque') {
                         setStatus("success");
                         window.scrollTo(0, 0);
                    } else {
                        throw new Error("Network response was not ok");
                    }
                } catch (error) {
                    console.error("Error:", error);
                    setErrorMsg("提交失敗，請檢查網路連線或稍後再試。");
                    setStatus("idle");
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            if (status === "success") {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                        <div className="bg-white rounded-2xl shadow-float p-10 max-w-lg w-full text-center fade-in border border-slate-100">
                            <div className="w-16 h-16 bg-brand-light rounded-full flex items-center justify-center mx-auto mb-6 text-brand-dark text-3xl">
                                <i className="ph-fill ph-star text-brand-DEFAULT"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-3 serif-title">提交成功</h2>
                            <p className="text-slate-500 mb-8 text-base leading-relaxed">
                                感謝您的寶貴回饋。<br/>您的意見將協助我們持續優化教學品質。<br/>資料已成功匯入系統。
                            </p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="bg-brand-dark text-white px-8 py-3 rounded-lg hover:bg-slate-700 transition-colors font-medium text-sm tracking-wide w-full shadow-lg shadow-brand-dark/20 focus:outline-none"
                            >
                                關閉視窗
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen py-6 md:py-10 px-3 md:px-6 bg-slate-50">
                    <div className="max-w-4xl mx-auto">
                        
                        {/* Error Notification */}
                        {errorMsg && (
                            <div className="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md px-4 fade-in">
                                <div className="bg-brand-accent text-white px-6 py-4 rounded-xl shadow-float flex items-center gap-4 border border-white/10 backdrop-blur-md">
                                    <i className="ph-fill ph-warning-circle text-2xl"></i>
                                    <span className="font-medium text-lg tracking-wide">{errorMsg}</span>
                                </div>
                            </div>
                        )}

                        {/* Main Container */}
                        <div className="bg-white rounded-3xl shadow-float overflow-hidden border border-slate-200/60 fade-in">
                            
                            {/* Header Banner */}
                            <header className="relative bg-brand-dark text-white p-8 md:p-10 text-center overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                                    <div className="absolute -top-20 -right-20 w-64 h-64 rounded-full border-4 border-white"></div>
                                    <div className="absolute top-10 -left-10 w-32 h-32 rounded-full border-2 border-white"></div>
                                </div>
                                
                                <div className="relative z-10">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-white/10 backdrop-blur-sm text-white/90 text-xs font-medium rounded-full mb-4 tracking-wider border border-white/20">
                                        <i className="ph ph-calendar-blank"></i>
                                        <span>2025.12.07</span>
                                    </div>
                                    <h1 className="text-2xl md:text-3xl font-bold mb-3 tracking-wide leading-tight serif-title">
                                        CCC 實務工作坊 <span className="font-light opacity-60 mx-1 text-xl">|</span> 後測問卷
                                    </h1>
                                    <p className="text-white/80 text-sm md:text-base max-w-2xl mx-auto leading-relaxed font-light">
                                        感謝您的參與。為了評估本次工作坊的實際效益並作為未來師資培訓優化的依據，請撥冗填寫以下回饋。
                                    </p>
                                </div>
                            </header>

                            <form onSubmit={handleSubmit} className="p-4 md:p-8 space-y-6 bg-slate-50/50">
                                
                                {/* Part 1: Basic Info */}
                                <SectionCard 
                                    title="基本資料" 
                                    subtitle="請協助我們了解您的專業背景"
                                    icon={<i className="ph-duotone ph-user-circle"></i>}
                                >
                                    <label className="block text-slate-700 font-bold text-base mb-4 pl-1">
                                        您的職類 <span className="text-brand-accent">*</span>
                                    </label>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        {roles.map(role => (
                                            <button
                                                key={role}
                                                type="button"
                                                onClick={() => {
                                                    setFormData({...formData, role});
                                                    setErrorMsg("");
                                                }}
                                                className={`
                                                    p-3 rounded-lg text-sm text-center transition-all duration-200 border relative overflow-hidden focus:outline-none
                                                    ${formData.role === role 
                                                        ? 'bg-brand text-white border-brand shadow-md font-bold' 
                                                        : 'bg-white border-slate-200 text-slate-600 hover:border-brand hover:text-brand hover:bg-slate-50 hover:shadow-sm'}
                                                `}
                                            >
                                                {role}
                                                {formData.role === role && (
                                                    <div className="absolute top-1 right-1 w-2 h-2 bg-white rounded-full"></div>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                </SectionCard>

                                {/* Part 2: Learning Outcome */}
                                <SectionCard 
                                    title="學習成效評估" 
                                    subtitle="經過今日的演練，請再次評估您是否「符合」下列描述"
                                    icon={<i className="ph-duotone ph-graduation-cap"></i>}
                                >
                                    <div className="space-y-4">
                                        {questionsPart2.map((q, idx) => (
                                            <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-100/50 transition-colors hover:bg-white hover:shadow-sm hover:border-slate-200">
                                                <p className="text-slate-700 font-medium text-base mb-3 leading-relaxed">
                                                    <span className="text-brand-accent mr-2 font-bold font-serif">{idx < 9 ? `0${idx + 1}` : idx + 1}.</span>
                                                    {q} <span className="text-brand-accent">*</span>
                                                </p>
                                                <LikertScale 
                                                    value={formData.part2[idx]} 
                                                    onChange={(val) => handleScaleChange('part2', idx, val)}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                </SectionCard>

                                {/* Part 3: Behavior Intention */}
                                <SectionCard 
                                    title="學習與應用" 
                                    subtitle="關於課程內容與實際臨床應用的連結"
                                    icon={<i className="ph-duotone ph-briefcase"></i>}
                                >
                                    <div className="space-y-4 mb-6">
                                        {questionsPart3.map((q, idx) => (
                                            <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-100/50 transition-colors hover:bg-white hover:shadow-sm hover:border-slate-200">
                                                <p className="text-slate-700 font-medium text-base mb-3 leading-relaxed">
                                                    <span className="text-brand-accent mr-2 font-bold font-serif">{idx < 9 ? `0${idx + 1}` : idx + 1}.</span>
                                                    {q} <span className="text-brand-accent">*</span>
                                                </p>
                                                <LikertScale 
                                                    value={formData.part3[idx]} 
                                                    onChange={(val) => handleScaleChange('part3', idx, val)}
                                                    lowLabel="非常不同意"
                                                    highLabel="非常同意"
                                                />
                                            </div>
                                        ))}
                                    </div>

                                    {/* Difficulties Checkbox */}
                                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 md:p-6">
                                        <p className="text-slate-700 font-bold text-base mb-4 leading-relaxed flex gap-2">
                                            <span className="text-brand-dark/40 font-serif font-bold text-sm mt-0.5">05.</span>
                                            <span>
                                                您認為回到臨床現場執行今日所學，最大的困難點可能在於 (可複選)
                                                <span className="text-brand-accent ml-1 text-sm align-top">*</span>
                                            </span>
                                        </p>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                            {difficulties.map((item) => (
                                                <label key={item} className={`
                                                    flex items-center gap-3 cursor-pointer group p-3 rounded-lg transition-all duration-200 border select-none
                                                    ${formData.part3_diff.includes(item) 
                                                        ? 'bg-white border-brand shadow-sm ring-1 ring-brand/20' 
                                                        : 'bg-white border-slate-200 hover:border-brand/50 hover:bg-slate-50'}
                                                `}>
                                                    <div className={`
                                                        w-5 h-5 rounded border flex-shrink-0 flex items-center justify-center transition-colors
                                                        ${formData.part3_diff.includes(item) ? 'bg-brand border-brand' : 'border-slate-300 bg-slate-50'}
                                                    `}>
                                                        {formData.part3_diff.includes(item) && <i className="ph-fill ph-star text-white text-xs"></i>}
                                                    </div>
                                                    <input 
                                                        type="checkbox" 
                                                        className="hidden"
                                                        checked={formData.part3_diff.includes(item)}
                                                        onChange={() => handleDiffChange(item)}
                                                    />
                                                    <span className={`font-medium text-sm ${formData.part3_diff.includes(item) ? 'text-brand-dark' : 'text-slate-600'}`}>
                                                        {item}
                                                    </span>
                                                </label>
                                            ))}
                                            
                                            {formData.part3_diff.includes("其他") && (
                                                <div className="col-span-1 md:col-span-2 mt-1 fade-in">
                                                    <input
                                                        type="text"
                                                        placeholder="請詳細說明您的困難點..."
                                                        className="w-full p-3 rounded-lg border border-slate-300 focus:border-brand focus:ring-1 focus:ring-brand outline-none bg-white text-slate-700 placeholder-slate-400 transition-colors text-sm"
                                                        value={formData.part3_diff_other}
                                                        onChange={(e) => setFormData({...formData, part3_diff_other: e.target.value})}
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </SectionCard>

                                {/* Part 4: Satisfaction */}
                                <SectionCard 
                                    title="課程滿意度評估" 
                                    subtitle="請針對本次課程的「講師」與「安排」給予整體評分"
                                    icon={<i className="ph-duotone ph-thumbs-up"></i>}
                                >
                                    <div className="space-y-4 mb-6">
                                        {questionsPart4.map((q, idx) => (
                                            <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-100/50 transition-colors hover:bg-white hover:shadow-sm hover:border-slate-200">
                                                <p className="text-slate-700 font-medium text-base mb-3 leading-relaxed">
                                                    <span className="text-brand-accent mr-2 font-bold font-serif">{idx < 9 ? `0${idx + 1}` : idx + 1}.</span>
                                                    {q} <span className="text-brand-accent">*</span>
                                                </p>
                                                <LikertScale 
                                                    value={formData.part4[idx]} 
                                                    onChange={(val) => handleScaleChange('part4', idx, val)}
                                                    lowLabel="非常不同意"
                                                    highLabel="非常同意"
                                                />
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-6 pt-6 border-t border-slate-100">
                                        <label className="block text-slate-700 font-bold text-base mb-3 flex gap-2">
                                            <span className="text-brand-dark/40 font-serif font-bold text-sm mt-0.5">06.</span>
                                            <span>若未來舉辦進階工作坊，您希望加強哪個部分的深度或其他回饋意見？</span>
                                        </label>
                                        <textarea
                                            rows="4"
                                            className="w-full p-4 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-brand focus:ring-1 focus:ring-brand outline-none transition-all text-slate-700 resize-none text-sm shadow-inner-light"
                                            placeholder="歡迎留下您的寶貴意見..."
                                            value={formData.part4_feedback}
                                            onChange={(e) => setFormData({...formData, part4_feedback: e.target.value})}
                                        ></textarea>
                                    </div>
                                </SectionCard>

                                {/* Submit Area - Professional Button */}
                                <div className="pt-6 flex flex-col items-center justify-center pb-6">
                                    <button 
                                        type="submit"
                                        disabled={status === "submitting"}
                                        className={`
                                            group relative bg-brand-dark hover:bg-slate-800 text-white text-base font-bold py-3 px-16 rounded-full shadow-lg hover:shadow-xl transform transition-all duration-300 w-full md:w-auto overflow-hidden focus:outline-none
                                            ${status === "submitting" ? 'opacity-75 cursor-not-allowed' : 'hover:-translate-y-1 active:translate-y-0'}
                                        `}
                                    >
                                        <span className="relative z-10 flex items-center justify-center gap-2">
                                            {status === "submitting" ? (
                                                <>
                                                    <i className="ph-bold ph-spinner animate-spin"></i>
                                                    <span>傳送中...</span>
                                                </>
                                            ) : (
                                                <>
                                                    <span>提交問卷</span>
                                                    <i className="ph-bold ph-paper-plane-right group-hover:translate-x-1 transition-transform"></i>
                                                </>
                                            )}
                                        </span>
                                        <div className="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                                    </button>
                                    <p className="mt-3 text-slate-400 text-xs">請確認所有必填項目皆已完成</p>
                                </div>
                            </form>
                        </div>

                        {/* Footer - Professional Style */}
                        <footer className="text-center py-8 text-slate-500">
                            <div className="mb-1 font-serif font-bold text-brand-dark tracking-wide text-sm">教學部 核心能力組</div>
                            <div className="text-xs opacity-80 font-light">
                                聯絡人：林淑雅 (#57438)｜楊宜婷 (#57429)
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
